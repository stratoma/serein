kind = "web"
previewPath = "/"
title = "Hello Creative & Co."
version = "1.0.0"
id = "artifacts/hello-creative"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21197

[services.development]
run = "pnpm --filter @workspace/hello-creative run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hello-creative", "run", "build" ]
publicDir = "artifacts/hello-creative/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21197"
BASE_PATH = "/"
