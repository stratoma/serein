kind = "web"
previewPath = "/serein/"
title = "SEREIN Skin"
version = "1.0.0"
id = "artifacts/serein"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/serein/" ]
localPort = 25278

[services.development]
run = "pnpm --filter @workspace/serein run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/serein", "run", "build" ]
publicDir = "artifacts/serein/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25278"
BASE_PATH = "/serein/"
